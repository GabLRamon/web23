<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - Restaurante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="js/app.js" defer></script>
</head>
<body class="container py-4" style="max-width: 500px;">
    <h1 class="mb-3">Login</h1>
    <nav class="mb-3">
        <a href="index.html" class="me-2">Login</a> | 
        <a href="cadastro.html" class="ms-2">Cadastrar usuário</a>
    </nav>
    <p id="mensagem" role="status" class="text-danger fw-bold"></p>
    <form id="login" class="card p-3">
        <div class="mb-3">
            <label class="form-label">Nome de usuário</label>
            <input name="nome" class="form-control" required autocomplete="username">
        </div>
        <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="senha" class="form-control" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary">Entrar</button>
    </form>
</body>
</html>
